<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>VELMORA — Sunset Streets</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a0a12;
    overflow: hidden;
  }
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    position: absolute;
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
  }
  #gl { z-index: 0; }
  #game { z-index: 1; pointer-events: none; }
  #status {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 4px;
    z-index: 2;
    text-align: center;
    color: #8a8a9a;
    font: 12px system-ui, sans-serif;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="stage">
  <canvas id="gl" width="1280" height="720"></canvas>
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<div id="status">VELMORA — Sunset Streets</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
