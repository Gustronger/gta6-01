<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELMORA — Sunset Streets</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14101c; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Kept off-screen: the live region screen readers announce as the game changes. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Velmora Sunset Streets: a top-down open-world crime game. Drive, take jobs from Nadia, and stay ahead of the Velmora PD."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
